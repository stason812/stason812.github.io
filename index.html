<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ANGELOV</title>
    <style>
        /* ... все стили как были, плюс добавляю новые ... */

        /* ===== КЛИК-ЭФФЕКТ ДЛЯ КНОПОК ===== */
        .link-item {
            /* ... существующие стили ... */
            transition: all 0.15s ease;
        }
        .link-item:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ===== СТАТУС DISCORD ===== */
        .discord-status {
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
        }
        .discord-status .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #23a55a; /* зелёный = онлайн */
            box-shadow: 0 0 8px rgba(35, 165, 90, 0.4);
        }
        .discord-status .offline-dot {
            background: #80848e; /* серый = оффлайн */
            box-shadow: none;
        }
        .discord-status .status-text {
            letter-spacing: 0.3px;
        }
        .discord-status .activity-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.65rem;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <!-- ... всё, как было, но добавляем блок со статусом Discord ... -->

    <div class="card">
        <!-- ... аватар, имя, описание, разделитель ... -->

        <div class="links">
            <a href="https://steamcommunity.com/profiles/76561199858781159/" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="label">steam</span>
            </a>
            <a href="https://t.me/stason812" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="label">telegram</span>
            </a>
            <a href="https://discord.com/users/1191918956865388684" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="label">discord</span>
            </a>
        </div>

        <!-- ===== БЛОК СТАТУСА DISCORD ===== -->
        <div class="discord-status" id="discordStatus">
            <span class="online-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Загрузка...</span>
            <span class="activity-text" id="activityText"></span>
        </div>

        <!-- ... аудиоплеер, футер ... -->
    </div>

    <script>
        // ============================================================
        // 1. СТАТУС DISCORD (через Lanyard)
        // ============================================================
        (function() {
            const userId = '1191918956865388684'; // твой Discord ID
            const ws = new WebSocket('wss://api.lanyard.rest/socket');

            let heartbeatInterval;

            ws.onopen = function() {
                console.log('Подключение к Lanyard установлено');
                // Отправляем идентификацию
                ws.send(JSON.stringify({
                    op: 2,
                    d: {
                        subscribe_to_id: userId
                    }
                }));
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.op === 1) {
                    // Heartbeat — отвечаем
                    ws.send(JSON.stringify({ op: 1 }));
                    return;
                }

                if (data.t === 'INIT_STATE' || data.t === 'PRESENCE_UPDATE') {
                    const presence = data.d;
                    updateDiscordStatus(presence);
                }
            };

            ws.onerror = function(err) {
                console.warn('Ошибка Lanyard, пробуем запасной вариант:', err);
                // Если WebSocket не работает — пробуем REST API
                fetch(`https://api.lanyard.rest/v1/users/${userId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            updateDiscordStatus(data.data);
                        } else {
                            setOfflineStatus();
                        }
                    })
                    .catch(() => setOfflineStatus());
            };

            function updateDiscordStatus(presence) {
                const dot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                const activityText = document.getElementById('activityText');

                // Определяем статус
                let status = presence.discord_status || 'offline';
                let statusLabel = {
                    online: 'В сети',
                    idle: 'Отошёл',
                    dnd: 'Не беспокоить',
                    offline: 'Оффлайн'
                }[status] || 'Оффлайн';

                // Цвет точки
                dot.className = 'online-dot';
                if (status === 'idle') {
                    dot.style.background = '#faa81a';
                    dot.style.boxShadow = '0 0 8px rgba(250, 168, 26, 0.4)';
                } else if (status === 'dnd') {
                    dot.style.background = '#ed4245';
                    dot.style.boxShadow = '0 0 8px rgba(237, 66, 69, 0.4)';
                } else if (status === 'online') {
                    dot.style.background = '#23a55a';
                    dot.style.boxShadow = '0 0 8px rgba(35, 165, 90, 0.4)';
                } else {
                    dot.className = 'online-dot offline-dot';
                    dot.style.boxShadow = 'none';
                }

                statusText.textContent = statusLabel;

                // Активность (игра)
                if (presence.activities && presence.activities.length > 0) {
                    const game = presence.activities.find(a => a.type === 0);
                    if (game) {
                        activityText.textContent = `🎮 ${game.name}`;
                        return;
                    }
                }
                activityText.textContent = '';
            }

            function setOfflineStatus() {
                const dot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                const activityText = document.getElementById('activityText');
                dot.className = 'online-dot offline-dot';
                dot.style.boxShadow = 'none';
                statusText.textContent = 'Не в сети';
                activityText.textContent = '';
            }

            // Очистка при закрытии
            window.addEventListener('beforeunload', function() {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.close();
                }
            });
        })();

        // ============================================================
        // 2. ОСТАЛЬНЫЕ СКРИПТЫ (аудио, звёзды) — без изменений
        // ============================================================
        // ... твой код для аудио и звёзд ...
    </script>
</body>
</html>
