<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ANGELOV</title>
    <style>
        @font-face {
            font-family: 'Anime Ace v3';
            src: url('https://fonts.cdnfonts.com/s/14842/AnimeAcev3.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Anime Ace v3';
            src: url('https://fonts.cdnfonts.com/s/14842/AnimeAcev3Bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        #dust-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* ===== CRY OF FEAR ===== */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }
        .intro-overlay.hidden {
            opacity: 0;
        }
        .intro-text {
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-size: 3.5rem;
            color: #ffffff;
            letter-spacing: 6px;
            text-shadow: 0 0 60px rgba(255,255,255,0.05);
            animation: cryPulse 2.2s ease-in-out forwards;
        }
        @keyframes cryPulse {
            0% { opacity: 0; transform: scale(0.9); }
            25% { opacity: 1; transform: scale(1); }
            70% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        /* ===== КАРТОЧКА ===== */
        .card {
            position: relative;
            z-index: 10;
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 32px 28px 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            opacity: 0;
            animation: cardAppear 0.8s ease 2.4s forwards;
        }
        @keyframes cardAppear {
            to { opacity: 1; }
        }

        .card > * {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.5s ease forwards;
        }
        .card .avatar { animation-delay: 0.1s; }
        .card .name-wrapper { animation-delay: 0.2s; }
        .card .badge { animation-delay: 0.3s; }
        .card .divider { animation-delay: 0.35s; }
        .card .links { animation-delay: 0.4s; }
        .card .audio-player { animation-delay: 0.5s; }
        .card .status-section { animation-delay: 0.6s; }
        .card .footer { animation-delay: 0.7s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== АВАТАР ===== */
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 6px;
            margin: 0 auto 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: border 0.3s;
        }
        .avatar video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%) contrast(1.1);
        }
        .avatar:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ===== НИК С СЕКРЕТОМ ===== */
        .name-wrapper {
            position: relative;
            display: inline-block;
            cursor: default;
        }
        .name-wrapper .name {
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            transition: text-shadow 0.3s;
        }
        .name-wrapper .name:hover {
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        .secret-image {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            width: 90px;
            height: 90px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            object-fit: cover;
        }
        .name-wrapper:hover .secret-image {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .badge {
            display: inline-block;
            margin-top: 2px;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-weight: 400;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-transform: uppercase;
        }
        .badge span { color: #ffffff; font-weight: 700; }

        .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            margin: 18px auto 20px;
        }

        /* ===== ССЫЛКИ ===== */
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 10px 18px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-weight: 400;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .link-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: scale(1.01);
        }
        .link-item:active {
            transform: scale(0.96);
        }
        .link-item .label {
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ===== ПЛЕЕР ===== */
        .audio-player {
            margin-top: 18px;
            padding: 10px 14px 14px;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .audio-player .track-info {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
            text-align: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
        }
        .audio-player .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .audio-player .controls button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 4px;
            border-radius: 30px;
            transition: background 0.2s;
            background: rgba(255,255,255,0.03);
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-player .controls button:hover {
            background: rgba(255,255,255,0.08);
        }
        .audio-player .controls button svg {
            display: block;
            color: #ffffff;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .audio-player .controls button:hover svg {
            opacity: 1;
        }
        .audio-player .controls .slider-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .audio-player .controls .slider-container input[type="range"] {
            width: 100%; height: 2px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
        }
        .audio-player .controls .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }
        .audio-player .controls .slider-container input[type="range"]::-moz-range-thumb {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: none;
        }
        .audio-player .time-display {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.25);
            min-width: 28px;
            text-align: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
        }
        .audio-player .volume-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 2px;
        }
        .audio-player .volume-row .vol-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            color: rgba(255, 255, 255, 0.3);
        }
        .audio-player .volume-row .vol-icon svg {
            display: block;
            stroke: rgba(255, 255, 255, 0.3);
        }
        .audio-player .volume-row input[type="range"] {
            flex: 1;
            height: 2px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
        }
        .audio-player .volume-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }
        .audio-player .volume-row input[type="range"]::-moz-range-thumb {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: none;
        }
        .volume-value {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            min-width: 24px;
            text-align: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
        }

        /* ===== СТАТУС "СЕЙЧАС ИГРАЮ" ===== */
        .status-section {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .status-label {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1.5px;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            text-transform: uppercase;
        }
        .status-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 3px 12px;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-size: 0.55rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .status-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
        }
        .status-btn.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
        .status-display {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            min-height: 1.2rem;
        }
        .status-display .highlight {
            color: rgba(255, 255, 255, 0.7);
        }

        .footer {
            margin-top: 14px;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 12px;
        }

        @media (max-width: 480px) {
            .card { padding: 24px 18px 28px; border-radius: 32px; }
            .name-wrapper .name { font-size: 1.8rem; }
            .avatar { width: 120px; height: 120px; }
            .link-item { padding: 8px 14px; font-size: 0.8rem; }
            .badge { font-size: 0.65rem; }
            .intro-text { font-size: 2rem; letter-spacing: 3px; }
            .secret-image { width: 70px; height: 70px; top: -90px; }
        }
    </style>
</head>
<body>

    <!-- ===== CRY OF FEAR ===== -->
    <div class="intro-overlay" id="introOverlay">
        <div class="intro-text">CRY OF FEAR</div>
    </div>

    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="https://www.image2url.com/r2/default/videos/1786313358394-421c86f5-2310-4697-8dfb-eeae79a5bbf2.mp4" type="video/mp4">
        </video>
    </div>

    <div class="overlay"></div>
    <canvas id="stars-canvas"></canvas>
    <canvas id="dust-canvas"></canvas>

    <div class="card">

        <div class="avatar">
            <video autoplay muted loop playsinline>
                <source src="https://lfdrive.ru/f/SSf9fkyM" type="video/mp4">
            </video>
        </div>

        <div class="name-wrapper">
            <div class="name">angelov</div>
            <img class="secret-image" src="https://i.pinimg.com/736x/61/ad/26/61ad263f5164a1e8ef17384e81fc4f0f.jpg" alt="" loading="lazy">
        </div>

        <div class="badge">
            <span>mid supp player</span> / love puck
        </div>

        <div class="divider"></div>

        <div class="links">
            <a href="https://steamcommunity.com/profiles/76561199858781159/" target="_blank" class="link-item">
                <span class="label">steam</span>
            </a>
            <a href="https://t.me/stason812" target="_blank" class="link-item">
                <span class="label">telegram</span>
            </a>
            <a href="https://discord.com/users/1191918956865388684" target="_blank" class="link-item">
                <span class="label">discord</span>
            </a>
        </div>

        <div class="audio-player">
            <div class="track-info">♫ Red Weather — Onda Andar</div>
            <div class="controls">
                <button id="playBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5,3 19,12 5,21" id="playIcon"/>
                        <rect x="6" y="4" width="4" height="16" id="pauseIcon" style="display:none;"/>
                        <rect x="14" y="4" width="4" height="16" id="pauseIcon2" style="display:none;"/>
                    </svg>
                </button>
                <div class="slider-container">
                    <input type="range" id="timeSlider" value="0" step="0.1">
                    <div style="display:flex; justify-content:space-between; padding:0 2px;">
                        <span class="time-display" id="currentTime">0:00</span>
                        <span class="time-display" id="durationTime">0:00</span>
                    </div>
                </div>
            </div>
            <div class="volume-row">
                <span class="vol-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                        <path d="M3 9v6h4l5 5V4L7 9H3z"></path>
                        <path d="M16 8a5 5 0 0 1 0 8"></path>
                        <path d="M19 5a9 9 0 0 1 0 14"></path>
                    </svg>
                </span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
                <span class="volume-value" id="volumeValue">50%</span>
            </div>
        </div>

        <div class="status-section">
            <div class="status-label">сейчас играю</div>
            <div class="status-buttons">
                <button class="status-btn" data-status="dota">Dota 2</button>
                <button class="status-btn" data-status="cs">CS2</button>
                <button class="status-btn" data-status="stream">Стрим</button>
                <button class="status-btn" data-status="offline">Оффлайн</button>
            </div>
            <div class="status-display" id="statusDisplay">⚡ <span class="highlight">Dota 2</span> — в поиске</div>
        </div>

        <div class="footer">
            <span>made with stason</span>
        </div>

    </div>

    <audio id="bgAudio" loop preload="auto">
        <source src="https://lfdrive.ru/f/E6C4lZ47" type="audio/mpeg">
    </audio>

    <script>
        // ===== 1. CRY OF FEAR =====
        (function() {
            const overlay = document.getElementById('introOverlay');
            setTimeout(() => {
                overlay.classList.add('hidden');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1200);
            }, 2200);
        })();

        // ===== 2. ПЕРЕЛИВАЮЩЕЕСЯ НАЗВАНИЕ =====
        (function() {
            const original = 'ANGELOV';
            const chars = original.split('');
            let index = 0;
            setInterval(() => {
                const newChars = chars.map((c, i) => i === index ? ' ' : c);
                document.title = newChars.join('');
                index = (index + 1) % chars.length;
            }, 200);
            setTimeout(() => document.title = original, 100);
        })();

        // ===== 3. АУДИОПЛЕЕР =====
        (function() {
            const audio = document.getElementById('bgAudio');
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const pause1 = document.getElementById('pauseIcon');
            const pause2 = document.getElementById('pauseIcon2');
            const timeSlider = document.getElementById('timeSlider');
            const volumeSlider = document.getElementById('volumeSlider');
            const volDisplay = document.getElementById('volumeValue');
            const curTime = document.getElementById('currentTime');
            const durTime = document.getElementById('durationTime');

            let autoPlayed = false;

            function fmt(sec) {
                if (isNaN(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            function updateTime() {
                if (audio.duration) {
                    timeSlider.value = (audio.currentTime / audio.duration) * 100;
                    curTime.textContent = fmt(audio.currentTime);
                    durTime.textContent = fmt(audio.duration);
                }
            }

            function setPlay(p) {
                if (p) {
                    playIcon.style.display = 'none';
                    pause1.style.display = 'block';
                    pause2.style.display = 'block';
                } else {
                    playIcon.style.display = 'block';
                    pause1.style.display = 'none';
                    pause2.style.display = 'none';
                }
            }

            audio.addEventListener('loadedmetadata', () => {
                durTime.textContent = fmt(audio.duration);
                timeSlider.max = 100;
            });
            audio.addEventListener('timeupdate', updateTime);
            audio.addEventListener('ended', () => {
                if (!audio.loop) {
                    audio.currentTime = 0;
                    setPlay(false);
                    timeSlider.value = 0;
                    curTime.textContent = '0:00';
                }
            });

            function tryAuto() {
                if (!autoPlayed && audio.paused && audio.src) {
                    autoPlayed = true;
                    audio.play().then(() => setPlay(true)).catch(() => setPlay(false));
                }
            }

            document.addEventListener('DOMContentLoaded', tryAuto);
            setTimeout(tryAuto, 800);
            document.addEventListener('click', tryAuto, { once: false });

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play().then(() => setPlay(true)).catch(() => alert('Ошибка воспроизведения'));
                } else {
                    audio.pause();
                    setPlay(false);
                }
            });

            timeSlider.addEventListener('input', function() {
                if (audio.duration) {
                    const newTime = (this.value / 100) * audio.duration;
                    audio.currentTime = newTime;
                    curTime.textContent = fmt(newTime);
                }
            });

            volumeSlider.addEventListener('input', function() {
                audio.volume = parseFloat(this.value);
                volDisplay.textContent = Math.round(parseFloat(this.value) * 100) + '%';
            });
            audio.volume = parseFloat(volumeSlider.value);
            volDisplay.textContent = Math.round(parseFloat(volumeSlider.value) * 100) + '%';
        })();

        // ===== 4. ФОНОВЫЙ ЗВУК ПРИ НАВЕДЕНИИ =====
        (function() {
            let ctx = null;
            const els = document.querySelectorAll('.link-item, .status-btn, #playBtn');
            els.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    try {
                        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = 700 + Math.random() * 500;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.02, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.08);
                    } catch (_) {}
                });
            });
        })();

        // ===== 5. СТАТУС "СЕЙЧАС ИГРАЮ" =====
        (function() {
            const btns = document.querySelectorAll('.status-btn');
            const display = document.getElementById('statusDisplay');
            const map = { dota: 'Dota 2', cs: 'CS2', stream: 'Стрим', offline: 'Оффлайн' };
            let current = localStorage.getItem('stason_status') || 'dota';

            function setStatus(status) {
                current = status;
                localStorage.setItem('stason_status', status);
                btns.forEach(b => b.classList.toggle('active', b.dataset.status === status));
                const label = map[status] || 'Dota 2';
                const icon = status === 'offline' ? '🌙' : '⚡';
                display.innerHTML = `${icon} <span class="highlight">${label}</span> — ${status === 'offline' ? 'не в игре' : 'в поиске'}`;
            }

            btns.forEach(b => b.addEventListener('click', () => setStatus(b.dataset.status)));
            setStatus(current);
        })();

        // ===== 6. ЗВЁЗДЫ =====
        (function() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            const stars = [];
            let mx = -1000, my = -1000;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: 1 + Math.random() * 2,
                    speedX: (Math.random() - 0.5) * 1.2,
                    speedY: (Math.random() - 0.5) * 1.2,
                    opacity: 0.3 + Math.random() * 0.5,
                    flicker: Math.random() * 0.02
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (const s of stars) {
                    const dx = s.x - mx, dy = s.y - my;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120 && dist > 0) {
                        const force = (1 - dist / 120) * 0.6;
                        s.speedX += (dx / dist) * force * 0.15;
                        s.speedY += (dy / dist) * force * 0.15;
                    }
                    s.speedX *= 0.99;
                    s.speedY *= 0.99;
                    s.x += s.speedX;
                    s.y += s.speedY;
                    s.opacity += s.flicker * (Math.random() - 0.5);
                    s.opacity = Math.min(0.8, Math.max(0.1, s.opacity));

                    if (s.x < -20) s.x = w + 20;
                    if (s.x > w + 20) s.x = -20;
                    if (s.y < -20) s.y = h + 20;
                    if (s.y > h + 20) s.y = -20;

                    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 2.5);
                    grad.addColorStop(0, `rgba(255,255,255,${s.opacity})`);
                    grad.addColorStop(0.5, `rgba(255,255,240,${s.opacity * 0.3})`);
                    grad.addColorStop(1, 'rgba(255,255,255,0)');

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${s.opacity * 0.8})`;
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ===== 7. ПЫЛЬЦА ПОД МЫШЬЮ =====
        (function() {
            const canvas = document.getElementById('dust-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            let mx = -1000, my = -1000;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            document.addEventListener('mousemove', e => {
                mx = e.clientX;
                my = e.clientY;
                for (let i = 0; i < 3; i++) {
                    particles.push({
                        x: mx + (Math.random() - 0.5) * 8,
                        y: my + (Math.random() - 0.5) * 8,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5 - 0.5,
                        life: 1,
                        decay: 0.01 + Math.random() * 0.02,
                        size: 2 + Math.random() * 4
                    });
                }
                if (particles.length > 200) particles.splice(0, 50);
            });

            function drawDust() {
                ctx.clearRect(0, 0, w, h);
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.02;
                    p.life -= p.decay;
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${p.life * 0.15})`;
                    ctx.fill();
                }
                requestAnimationFrame(drawDust);
            }
            drawDust();
        })();
    </script>
</body>
