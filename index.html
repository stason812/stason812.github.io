<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ANGELOV</title>
    <style>
        @font-face {
            font-family: 'Anime Ace v3';
            src: url('https://fonts.cdnfonts.com/s/14842/AnimeAcev3.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Anime Ace v3';
            src: url('https://fonts.cdnfonts.com/s/14842/AnimeAcev3Bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            gap: 30px;
            flex-wrap: wrap;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        .bottom-shadow {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            max-width: 580px;
            width: 90%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 48px 48px 36px 36px;
            padding: 32px 28px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transition: transform 0.25s ease;
            text-align: center;
            flex-shrink: 0;
        }
        .card:hover {
            transform: scale(1.005);
        }

        .comments-sidebar {
            position: relative;
            z-index: 10;
            max-width: 320px;
            width: 90%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 24px 20px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .comments-sidebar .sidebar-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 14px;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .comments-sidebar .comments-container {
            flex: 1;
            overflow-y: auto;
            max-height: 320px;
            margin-bottom: 12px;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.05) transparent;
        }
        .comments-sidebar .comments-container::-webkit-scrollbar {
            width: 3px;
        }
        .comments-sidebar .comments-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .comment-item {
            text-align: left;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .comment-item .comment-author {
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            margin-right: 6px;
        }
        .comment-item .comment-time {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            float: right;
        }
        .comment-form {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .comment-form input {
            flex: 1;
            min-width: 60px;
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 0.7rem;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            outline: none;
            transition: border 0.2s;
        }
        .comment-form input:focus {
            border-color: rgba(255, 255, 255, 0.2);
        }
        .comment-form button {
            padding: 6px 16px;
            border-radius: 30px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            transition: background 0.2s;
        }
        .comment-form button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .card > * {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }
        .card .avatar { animation-delay: 0.1s; }
        .card .name { animation-delay: 0.2s; }
        .card .badge { animation-delay: 0.3s; }
        .card .divider { animation-delay: 0.35s; }
        .card .links { animation-delay: 0.4s; }
        .card .audio-player { animation-delay: 0.5s; }
        .card .footer { animation-delay: 0.6s; }

        .comments-sidebar > * {
            opacity: 0;
            transform: translateX(20px);
            animation: slideInRight 0.5s ease forwards;
        }
        .comments-sidebar .sidebar-title { animation-delay: 0.1s; }
        .comments-sidebar .comments-container { animation-delay: 0.2s; }
        .comments-sidebar .comment-form { animation-delay: 0.3s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            to { opacity: 1; transform: translateX(0); }
        }

        .avatar {
            width: 180px;
            height: 180px;
            border-radius: 6px;
            margin: 0 auto 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: border 0.3s;
        }
        .avatar video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%) contrast(1.1);
        }
        .avatar:hover {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .name {
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-weight: 700;
            font-size: 2.6rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 6px;
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            margin-top: 2px;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-weight: 400;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #f0f0f0;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            text-transform: uppercase;
        }
        .badge span { color: #ffffff; font-weight: 700; }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            margin: 22px auto 26px;
        }

        .links { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
        .link-item {
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 14px 22px;
            text-decoration: none;
            color: #ffffff;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-weight: 400;
            font-size: 1.05rem;
            transition: all 0.15s ease;
            backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .link-item:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .link-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: left 0.5s;
        }
        .link-item:hover::before { left: 100%; }
        .link-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.01);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }
        .link-item .label { text-align: center; letter-spacing: 0.5px; }

        .audio-player {
            margin-top: 20px;
            padding: 12px 16px 16px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .audio-player .track-info {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            text-align: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
        }
        .audio-player .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .audio-player .controls button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 4px;
            border-radius: 30px;
            transition: background 0.2s, opacity 0.2s;
            background: rgba(255,255,255,0.05);
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-player .controls button:hover {
            background: rgba(255,255,255,0.15);
        }
        .audio-player .controls button svg {
            display: block;
            color: #ffffff;
            transition: opacity 0.2s;
        }
        .audio-player .controls button:hover svg {
            opacity: 0.7;
        }
        .audio-player .controls .slider-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .audio-player .controls .slider-container input[type="range"] {
            width: 100%; height: 4px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px; outline: none;
        }
        .audio-player .controls .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: #ffffff; cursor: pointer;
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }
        .audio-player .controls .slider-container input[type="range"]::-moz-range-thumb {
            width: 12px; height: 12px; border-radius: 50%;
            background: #ffffff; cursor: pointer; border: none;
        }
        .audio-player .time-display {
            font-size: 0.6rem; color: rgba(255, 255, 255, 0.4);
            min-width: 32px; text-align: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
        }
        .audio-player .volume-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }
        .audio-player .volume-row .vol-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            color: rgba(255, 255, 255, 0.5);
        }
        .audio-player .volume-row .vol-icon svg {
            display: block;
            stroke: rgba(255, 255, 255, 0.5);
        }
        .audio-player .volume-row input[type="range"] {
            flex: 1; height: 3px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px; outline: none;
        }
        .audio-player .volume-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 10px; height: 10px; border-radius: 50%;
            background: #ffffff; cursor: pointer;
        }
        .audio-player .volume-row input[type="range"]::-moz-range-thumb {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ffffff; cursor: pointer; border: none;
        }
        .volume-value {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            min-width: 28px;
            text-align: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
        }

        .footer {
            margin-top: 16px;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 14px;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; gap: 20px; }
            .card { max-width: 100%; width: 100%; }
            .comments-sidebar { max-width: 100%; width: 100%; max-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="https://www.image2url.com/r2/default/videos/1786313358394-421c86f5-2310-4697-8dfb-eeae79a5bbf2.mp4" type="video/mp4">
        </video>
    </div>

    <div class="overlay"></div>
    <div class="bottom-shadow"></div>
    <canvas id="stars-canvas"></canvas>

    <div class="card">

        <div class="avatar">
            <video autoplay muted loop playsinline>
                <source src="https://lfdrive.ru/f/SSf9fkyM" type="video/mp4">
                Твой браузер не поддерживает видео.
            </video>
        </div>

        <div class="name">angelov</div>

        <div class="badge">
            <span>mid supp player</span> / love puck
        </div>

        <div class="divider"></div>

        <div class="links">
            <a href="https://steamcommunity.com/profiles/76561199858781159/" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="label">steam</span>
            </a>
            <a href="https://t.me/stason812" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="label">telegram</span>
            </a>
            <a href="https://discord.com/users/1191918956865388684" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="label">discord</span>
            </a>
        </div>

        <div class="audio-player">
            <div class="track-info">♫ Red Weather — Onda Andar</div>
            <div class="controls">
                <button id="playBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5,3 19,12 5,21" id="playIcon"/>
                        <rect x="6" y="4" width="4" height="16" id="pauseIcon" style="display:none;"/>
                        <rect x="14" y="4" width="4" height="16" id="pauseIcon2" style="display:none;"/>
                    </svg>
                </button>
                <div class="slider-container">
                    <input type="range" id="timeSlider" value="0" step="0.1">
                    <div style="display:flex; justify-content:space-between; padding:0 2px;">

                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9v6h4l5 5V4L7 9H3z"></path>
                        <path d="M16 8a5 5 0 0 1 0 8"></path>
                        <path d="M19 5a9 9 0 0 1 0 14"></path>
                    </svg>
                </span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">

        <div class="footer">
            <span>made with stason</span>
        </div>

    </div>

    <!-- ===== КОММЕНТАРИИ С МИНИМАЛИСТИЧНОЙ ИКОНКОЙ ===== -->
    <div class="comments-sidebar" id="commentsSidebar">
        <div class="sidebar-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="11" r="1" fill="white" stroke="none"/>
                <circle cx="16" cy="11" r="1" fill="white" stroke="none"/>
                <circle cx="8" cy="11" r="1" fill="white" stroke="none"/>
            </svg>
            комментарии
        </div>
        <div class="comments-container" id="commentsContainer"></div>
        <div class="comment-form">
            <input type="text" id="commentAuthor" placeholder="имя" maxlength="20">
            <input type="text" id="commentText" placeholder="сообщение..." maxlength="100">
            <button id="commentSubmit">➤</button>
        </div>
    </div>

    <audio id="bgAudio" loop preload="auto">
        <source src="https://lfdrive.ru/f/E6C4lZ47" type="audio/mpeg">
        Твой браузер не поддерживает аудио.
    </audio>

    <script>
        // ============================================================
        // 1. ПЕРЕЛИВАЮЩЕЕСЯ НАЗВАНИЕ ВКЛАДКИ
        // ============================================================
        (function() {
            const originalTitle = 'ANGELOV';
            const chars = originalTitle.split('');
            let index = 0;

            function updateTitle() {
                const newChars = chars.map((char, i) => {
                    if (i === index) {
                        return ' ';
                    }
                    return char;
                });
                document.title = newChars.join('');
                index = (index + 1) % chars.length;
            }

            setInterval(updateTitle, 200);
            setTimeout(() => document.title = originalTitle, 100);
        })();

        // ============================================================
        // 2. АУДИОПЛЕЕР
        // ============================================================
        (function() {
            const audio = document.getElementById('bgAudio');
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon1 = document.getElementById('pauseIcon');
            const pauseIcon2 = document.getElementById('pauseIcon2');
            const timeSlider = document.getElementById('timeSlider');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeValueDisplay = document.getElementById('volumeValue');
            const currentTimeDisplay = document.getElementById('currentTime');
            const durationDisplay = document.getElementById('durationTime');

            let autoPlayAttempted = false;

            function formatTime(sec) {
                if (isNaN(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            function updateTime() {
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    timeSlider.value = percent;
                    currentTimeDisplay.textContent = formatTime(audio.currentTime);
                    durationDisplay.textContent = formatTime(audio.duration);
                }
            }

            function setPlayState(playing) {
                if (playing) {
                    playIcon.style.display = 'none';
                    pauseIcon1.style.display = 'block';
                    pauseIcon2.style.display = 'block';
                } else {
                    playIcon.style.display = 'block';
                    pauseIcon1.style.display = 'none';
                    pauseIcon2.style.display = 'none';
                }
            }

            audio.addEventListener('loadedmetadata', function() {
                durationDisplay.textContent = formatTime(audio.duration);
                timeSlider.max = 100;
            });

            audio.addEventListener('timeupdate', updateTime);

            audio.addEventListener('ended', function() {
                if (!audio.loop) {
                    audio.currentTime = 0;
                    setPlayState(false);
                    timeSlider.value = 0;
                    currentTimeDisplay.textContent = '0:00';
                }
            });

            function tryAutoPlay() {
                if (!autoPlayAttempted && audio.paused && audio.src && audio.src !== '') {
                    autoPlayAttempted = true;
                    audio.play()
                        .then(() => setPlayState(true))
                        .catch(() => setPlayState(false));
                }
            }

            document.addEventListener('DOMContentLoaded', tryAutoPlay);
            setTimeout(tryAutoPlay, 1000);

            document.addEventListener('click', function() {
                if (audio.paused && audio.src && audio.src !== '') {
                    tryAutoPlay();
                }
            }, { once: false });

            playBtn.addEventListener('click', function() {
                if (audio.paused) {
                    audio.play()
                        .then(() => setPlayState(true))
                        .catch(() => alert('Не удалось воспроизвести трек. Проверь ссылку на файл.'));
                } else {
                    audio.pause();
                    setPlayState(false);
                }
            });

            timeSlider.addEventListener('input', function() {
                if (audio.duration) {
                    const newTime = (this.value / 100) * audio.duration;
                    audio.currentTime = newTime;
                    currentTimeDisplay.textContent = formatTime(newTime);
                }
            });

            function updateVolumeDisplay() {
                const val = parseFloat(volumeSlider.value);
                audio.volume = val;
                volumeValueDisplay.textContent = Math.round(val * 100) + '%';
            }

            volumeSlider.addEventListener('input', updateVolumeDisplay);
            audio.volume = parseFloat(volumeSlider.value);
            volumeValueDisplay.textContent = Math.round(parseFloat(volumeSlider.value) * 100) + '%';
        })();

        // ============================================================
        // 3. КАСТОМНЫЙ ЗВУК ПРИ КЛИКЕ
        // ============================================================
        (function() {
            const clickSound = new Audio('https://www.soundjay.com/misc/sounds/button-click-01.mp3');
            clickSound.volume = 0.15;

            document.querySelectorAll('.link-item').forEach(link => {
                link.addEventListener('click', function() {
                    clickSound.play().catch(() => {});
                });
            });
        })();

        // ============================================================
        // 4. КОММЕНТАРИИ
        // ============================================================
        (function() {
            const container = document.getElementById('commentsContainer');
            const authorInput = document.getElementById('commentAuthor');
            const textInput = document.getElementById('commentText');
            const submitBtn = document.getElementById('commentSubmit');

            const STORAGE_KEY = 'stason812_comments';

            function loadComments() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                } catch {
                    return [];
                }
            }

            function saveComments(comments) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function renderComments() {
                const comments = loadComments();
                container.innerHTML = '';
                if (comments.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.15);font-size:0.6rem;padding:8px 0;">пока тихо...</div>';
                    return;
                }
                const reversed = comments.slice(-10).reverse();
                reversed.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'comment-item';
                    const time = new Date(c.timestamp).toLocaleString('ru', { hour: '2-digit', minute: '2-digit' });
                    div.innerHTML = `
                        <span class="comment-author">${escapeHtml(c.author)}</span>
                        ${escapeHtml(c.text)}
                        <span class="comment-time">${time}</span>
                    `;
                    container.appendChild(div);
                });
            }

            function addComment() {
                const author = authorInput.value.trim() || 'anon';
                const text = textInput.value.trim();
                if (!text) return;

                const comments = loadComments();
                comments.push({ author, text, timestamp: Date.now() });
                saveComments(comments);
                authorInput.value = '';
                textInput.value = '';
                renderComments();
            }

            submitBtn.addEventListener('click', addComment);
            textInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addComment();
            });

            renderComments();
        })();

        // ============================================================
        // 5. ЗВЁЗДЫ (150 ШТУК)
        // ============================================================
        (function() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];
            let mouseX = -1000, mouseY = -1000;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            const STAR_COUNT = 150;
            const MAX_SPEED = 1.8;
            const MIN_SIZE = 1.5;
            const MAX_SIZE = 3.2;

            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * (MAX_SIZE - MIN_SIZE) + MIN_SIZE,
                    speedX: (Math.random() - 0.5) * MAX_SPEED * 0.7,
                    speedY: (Math.random() - 0.5) * MAX_SPEED * 0.7,
                    opacity: Math.random() * 0.7 + 0.3,
                    flicker: Math.random() * 0.02
                });
            }

            function drawStars() {
                ctx.clearRect(0, 0, width, height);

                for (let s of stars) {
                    const dx = s.x - mouseX;
                    const dy = s.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 150;

                    if (dist < maxDist && dist > 0) {
                        const force = (1 - dist / maxDist) * 0.8;
                        s.speedX += (dx / dist) * force * 0.2;
                        s.speedY += (dy / dist) * force * 0.2;
                    }

                    s.speedX *= 0.99;
                    s.speedY *= 0.99;

                    s.x += s.speedX;
                    s.y += s.speedY;

                    s.opacity += s.flicker * (Math.random() - 0.5);
                    s.opacity = Math.min(1, Math.max(0.1, s.opacity));

                    if (s.x < -50) s.x = width + 50;
                    if (s.x > width + 50) s.x = -50;
                    if (s.y < -50) s.y = height + 50;
                    if (s.y > height + 50) s.y = -50;

                    const gradient = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 3);
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${s.opacity})`);
                    gradient.addColorStop(0.4, `rgba(255, 255, 200, ${s.opacity * 0.4})`);
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity * 0.9})`;
                    ctx.fill();
                }

                requestAnimationFrame(drawStars);
            }
            drawStars();
        })();
    </script>
