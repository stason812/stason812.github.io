<!DOCTYPE html>
<html lang="ru">
<head>

    <title>ANGELOV</title>
    <style>
        @font-face {
            font-family: 'Anime Ace v3';
            src: url('https://fonts.cdnfonts.com/s/14842/AnimeAcev3.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Anime Ace v3';
            src: url('https://fonts.cdnfonts.com/s/14842/AnimeAcev3Bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Anime Ace v3', 'Arial Black', 'Impact', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        .bottom-shadow {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 48px;
            padding: 32px 28px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transition: transform 0.25s ease;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .card:hover {
            transform: scale(1.005);
        }

        .left-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .right-col {
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            padding-left: 24px;
            min-height: 300px;
        }

        .card > * {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }
        .card .left-col { animation-delay: 0.1s; }
        .card .right-col { animation-delay: 0.2s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 6px;
            margin: 0 auto 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);

    <script>
        // ============================================================
        // 1. ПЕРЕЛИВАЮЩЕЕСЯ НАЗВАНИЕ ВКЛАДКИ
        // ============================================================
        (function() {
            const originalTitle = 'ANGELOV';
            const chars = originalTitle.split('');
            let index = 0;

            function updateTitle() {
                const newChars = chars.map((char, i) => {
                    if (i === index) {
                        return ' ';
                    }
                    return char;
                });
                document.title = newChars.join('');
                index = (index + 1) % chars.length;
            }

            setInterval(updateTitle, 200);
            setTimeout(() => document.title = originalTitle, 100);
        })();

        // ============================================================
        // 2. АУДИОПЛЕЕР
        // ============================================================
        (function() {
            const audio = document.getElementById('bgAudio');
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon1 = document.getElementById('pauseIcon');
            const pauseIcon2 = document.getElementById('pauseIcon2');
            const timeSlider = document.getElementById('timeSlider');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeValueDisplay = document.getElementById('volumeValue');
            const currentTimeDisplay = document.getElementById('currentTime');
            const durationDisplay = document.getElementById('durationTime');

            let autoPlayAttempted = false;

            function formatTime(sec) {
                if (isNaN(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            function updateTime() {
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    timeSlider.value = percent;
                    currentTimeDisplay.textContent = formatTime(audio.currentTime);
                    durationDisplay.textContent = formatTime(audio.duration);
                }
            }

            function setPlayState(playing) {
                if (playing) {
                    playIcon.style.display = 'none';
                    pauseIcon1.style.display = 'block';
                    pauseIcon2.style.display = 'block';
                } else {
                    playIcon.style.display = 'block';
                    pauseIcon1.style.display = 'none';
                    pauseIcon2.style.display = 'none';
                }
            }

            audio.addEventListener('loadedmetadata', function() {
                durationDisplay.textContent = formatTime(audio.duration);
                timeSlider.max = 100;
            });

            audio.addEventListener('timeupdate', updateTime);

            audio.addEventListener('ended', function() {
                if (!audio.loop) {
                    audio.currentTime = 0;
                    setPlayState(false);
                    timeSlider.value = 0;
                    currentTimeDisplay.textContent = '0:00';
                }
            });

            function tryAutoPlay() {
                if (!autoPlayAttempted && audio.paused && audio.src && audio.src !== '') {
                    autoPlayAttempted = true;
                    audio.play()
                        .then(() => setPlayState(true))
                        .catch(() => setPlayState(false));
                }
            }

            document.addEventListener('DOMContentLoaded', tryAutoPlay);
            setTimeout(tryAutoPlay, 1000);

            document.addEventListener('click', function() {
                if (audio.paused && audio.src && audio.src !== '') {
                    tryAutoPlay();
                }
            }, { once: false });

            playBtn.addEventListener('click', function() {
                if (audio.paused) {
                    audio.play()
                        .then(() => setPlayState(true))
                        .catch(() => alert('Не удалось воспроизвести трек. Проверь ссылку на файл.'));
                } else {
                    audio.pause();
                    setPlayState(false);
                }
            });

            timeSlider.addEventListener('input', function() {
                if (audio.duration) {
                    const newTime = (this.value / 100) * audio.duration;
                    audio.currentTime = newTime;
                    currentTimeDisplay.textContent = formatTime(newTime);
                }
            });

            function updateVolumeDisplay() {
                const val = parseFloat(volumeSlider.value);
                audio.volume = val;
                volumeValueDisplay.textContent = Math.round(val * 100) + '%';
            }

            volumeSlider.addEventListener('input', updateVolumeDisplay);
            audio.volume = parseFloat(volumeSlider.value);
            volumeValueDisplay.textContent = Math.round(parseFloat(volumeSlider.value) * 100) + '%';
        })();

    async function loadComments() {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': MASTER_KEY },
                cache: 'no-store'
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const comments = data.record || [];
            localStorage.setItem(LOCAL_KEY, JSON.stringify(comments));
            return comments;
        } catch (e) {
            console.warn('Ошибка загрузки из JSONBin, беру из localStorage:', e);
            try {
                return JSON.parse(localStorage.getItem(LOCAL_KEY)) || [];
            } catch {
                return [];
            }
        }
    }

    async function saveComments(comments) {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(comments)
            });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Ошибка ${response.status}: ${errorText}`);
            }
            localStorage.setItem(LOCAL_KEY, JSON.stringify(comments));
            return true;
        } catch (e) {
            console.warn('Ошибка сохранения в JSONBin, сохраняю локально:', e);
            localStorage.setItem(LOCAL_KEY, JSON.stringify(comments));
            return false;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderComments(comments) {
        container.innerHTML = '';
        if (!comments || comments.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.12);font-size:0.6rem;padding:16px 0;">пока тихо...</div>';
            return;
        }
        const reversed = comments.slice(-12).reverse();
        reversed.forEach(c => {
            const div = document.createElement('div');
            div.className = 'comment-item';
            const time = new Date(c.timestamp).toLocaleString('ru', { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `
                <span class="comment-author">${escapeHtml(c.author)}</span>
                <span class="comment-text">${escapeHtml(c.text)}</span>
                <span class="comment-time">${time}</span>
            `;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    async function addComment() {
        const author = authorInput.value.trim() || 'anon';
        const text = textInput.value.trim();
        if (!text) {
            textInput.style.borderColor = 'rgba(255,100,100,0.4)';
            setTimeout(() => textInput.style.borderColor = '', 1500);
            return;
        }

        submitBtn.textContent = '⏳';
        submitBtn.disabled = true;

        try {
            const currentComments = await loadComments();
            const newComment = { author, text, timestamp: Date.now() };
            currentComments.push(newComment);
            await saveComments(currentComments);
            renderComments(currentComments);
            authorInput.value = '';
            textInput.value = '';
        } catch (e) {
            console.error('Ошибка при добавлении комментария:', e);
            alert('Не удалось отправить комментарий. Проверь соединение.');
        } finally {
            submitBtn.textContent = '➤';
            submitBtn.disabled = false;
        }
    }

    async function init() {
        const comments = await loadComments();
        renderComments(comments);
    }

    submitBtn.addEventListener('click', addComment);
    textInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addComment();
        }
    });

    init();
})();

        // 5. ЗВЁЗДЫ
        // ============================================================
        (function() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];
            let mouseX = -1000, mouseY = -1000;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            const STAR_COUNT = 150;
            const MAX_SPEED = 1.8;
            const MIN_SIZE = 1.5;
            const MAX_SIZE = 3.2;

            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * (MAX_SIZE - MIN_SIZE) + MIN_SIZE,
                    speedX: (Math.random() - 0.5) * MAX_SPEED * 0.7,
                    speedY: (Math.random() - 0.5) * MAX_SPEED * 0.7,
                    opacity: Math.random() * 0.7 + 0.3,
                    flicker: Math.random() * 0.02
                });
            }

            function drawStars() {
                ctx.clearRect(0, 0, width, height);

                for (let s of stars) {
                    const dx = s.x - mouseX;
                    const dy = s.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 150;

                    if (dist < maxDist && dist > 0) {
                        const force = (1 - dist / maxDist) * 0.8;
                        s.speedX += (dx / dist) * force * 0.2;
                        s.speedY += (dy / dist) * force * 0.2;
                    }

                    s.speedX *= 0.99;
                    s.speedY *= 0.99;

                    s.x += s.speedX;
                    s.y += s.speedY;

                    s.opacity += s.flicker * (Math.random() - 0.5);
                    s.opacity = Math.min(1, Math.max(0.1, s.opacity));

                    if (s.x < -50) s.x = width + 50;
                    if (s.x > width + 50) s.x = -50;
                    if (s.y < -50) s.y = height + 50;
                    if (s.y > height + 50) s.y = -50;

                    const gradient = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 3);
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${s.opacity})`);
                    gradient.addColorStop(0.4, `rgba(255, 255, 200, ${s.opacity * 0.4})`);
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity * 0.9})`;
                    ctx.fill();
                }

                requestAnimationFrame(drawStars);
            }
            drawStars();
        })();
    </script>
